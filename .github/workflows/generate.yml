name: Generate assets
on:
  workflow_dispatch:
  push:
    branches: ["canary"]

jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - name: "⬇️ Fetch resources"
        uses: actions/checkout@v6
      - name: "🧩 Install Node 22"
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: "📦 Install deps"
        run: yarn install --frozen-lockfile
      - name: "⬆️ Upload deps as artifact"
        uses: actions/upload-artifact@v6
        with:
          name: node-modules
          path: ./node_modules

  semver:
    runs-on: ubuntu-latest
    needs: deps
    steps:
      - name: "⬇️ Fetch resources"
        uses: actions/checkout@v6
      - name: "🧩 Install Node 22"
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: "⬇️ Download dependencies from artifact"
        uses: actions/download-artifact@v4
        with:
          name: node-modules
          path: ./node_modules
      - name: "🧵 Calculate Node.js version semver"
        run: |
          ls
          yarn script:semver

